<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mr. Kevin - Profile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page-container">

    <!-- 1. Header Section -->
    <header class="header">
      <div class="profile-pic-container">
        <!-- Replace src with your profile photo -->
        <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=150" alt="Profile Photo" class="profile-img">
      </div>
      <div class="name-bar">
        <div class="social-icons">
          <span class="icon fb">f</span>
          <span class="icon tw">t</span>
          <span class="icon gp">g+</span>
        </div>
        <h1 class="header-name">Mr. Kevin peterson</h1>
      </div>
    </header>

    <!-- 2. Navigation Bar -->
    <nav class="sub-nav">
      <a href="#personal" class="nav-item">Personal</a>
      <a href="#academic" class="nav-item">Academic</a>
      <a href="#activity" class="nav-item">Activity</a>
      <a href="#others" class="nav-item">Others</a>
    </nav>

    <!-- 3. Bio / About Banner Section -->
    <section class="banner-section">
      <div class="bio-card">
        <p>
          Lorem ipsum dolor sit amet, consectetur adipiscing elit. Praesent a volutpat ex, at blandit neque. Cras malesuada consectetur leo, porta malesuada purus volutpat in.
        </p>
      </div>
      <div class="banner-graphic">
        <!-- SVG silhouette graphic representing friends/community -->
        <svg viewBox="0 0 400 200" class="graphic-svg">
          <circle cx="100" cy="50" r="28" fill="#1b6068" />
          <path d="M50 180 C50 100, 150 100, 150 180 Z" fill="#1b6068" />
          
          <circle cx="200" cy="45" r="30" fill="#144d54" />
          <path d="M140 180 C140 90, 260 90, 260 180 Z" fill="#144d54" />

          <circle cx="300" cy="50" r="28" fill="#1b6068" />
          <path d="M250 180 C250 100, 350 100, 350 180 Z" fill="#1b6068" />
        </svg>
      </div>
    </section>

    <!-- 4. Skills / Badges Row -->
    <section class="skills-row">
      <!-- HTML5 Box -->
      <div class="skill-card html5-card">
        <div class="skill-body">
          <span class="tech-sub">HTML</span>
          <span class="tech-num">5</span>
        </div>
        <div class="skill-label">HTML5</div>
      </div>

      <!-- CSS3 Box -->
      <div class="skill-card css3-card">
        <div class="skill-body">
          <span class="tech-sub">CSS</span>
          <span class="tech-num">3</span>
        </div>
        <div class="skill-label">CSS3</div>
      </div>

      <!-- JavaScript Box -->
      <div class="skill-card js-card">
        <div class="skill-body">
          <div class="js-badge">JS</div>
        </div>
        <div class="skill-label">Javascript</div>
      </div>

      <!-- PHP Box -->
      <div class="skill-card php-card">
        <div class="skill-body">
          <span class="php-logo">php</span>
        </div>
        <div class="skill-label">PHP</div>
      </div>
    </section>

    <div class="divider-line"></div>

    <!-- 5. Family / Quotes Section -->
    <section class="family-section">
      <!-- Father Column -->
      <div class="member-col">
        <div class="circle-avatar avatar-father">
          <img src="https://img.freepik.com/free-vector/happy-father-hugging-children-avatar_24877-60144.jpg" alt="Father">
        </div>
        <h3 class="member-title">MR. FATHER'S
